name: C/C++ CI

on:
  push:
    branches: [master, develop, testing]
  pull_request:
    branches: [master, develop, testing]
  workflow_dispatch:

jobs:
  # Linux builds with GCC and Clang on Ubuntu 22.04 and 24.04
  linux_64_bit:
    strategy:
      fail-fast: false
      matrix:
        config:
          # === Ubuntu 22.04 (Jammy Jellyfish) ===
          # GCC versions
          - name: Ubuntu22.04_x64 gcc11
            os: ubuntu-22.04
            cc: gcc-11
            cxx: g++-11
            packages: gcc-11 g++-11

          - name: Ubuntu22.04_x64 gcc12
            os: ubuntu-22.04
            cc: gcc-12
            cxx: g++-12
            packages: gcc-12 g++-12

          # Clang versions
          - name: Ubuntu22.04_x64 clang14
            os: ubuntu-22.04
            cc: clang-14
            cxx: clang++-14
            packages: clang-14

          - name: Ubuntu22.04_x64 clang15
            os: ubuntu-22.04
            cc: clang-15
            cxx: clang++-15
            packages: clang-15

          # === Ubuntu 24.04 (Noble Numbat) ===
          # GCC versions
          - name: Ubuntu24.04_x64 gcc13
            os: ubuntu-24.04
            cc: gcc-13
            cxx: g++-13
            packages: gcc-13 g++-13

          - name: Ubuntu24.04_x64 gcc14
            os: ubuntu-24.04
            cc: gcc-14
            cxx: g++-14
            packages: gcc-14 g++-14

          # Clang versions
          - name: Ubuntu24.04_x64 clang16
            os: ubuntu-24.04
            cc: clang-16
            cxx: clang++-16
            packages: clang-16

          - name: Ubuntu24.04_x64 clang17
            os: ubuntu-24.04
            cc: clang-17
            cxx: clang++-17
            packages: clang-17

          - name: Ubuntu24.04_x64 clang18
            os: ubuntu-24.04
            cc: clang-18
            cxx: clang++-18
            packages: clang-18

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    env:
      CC: ${{ matrix.config.cc }}
      CXX: ${{ matrix.config.cxx }}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt update && sudo apt-get install ${{ matrix.config.packages }} cmake libusb-1.0.0-dev libgtk-3-dev

      - name: Verify CMake version
        run: cmake --version

      - name: Prepare build directories
        run: mkdir -p ./build/{debug,release}

      - name: Configure project (Debug)
        working-directory: ./build/debug
        run: cmake ../.. -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Debug

      - name: Build project (Debug)
        working-directory: ./build/debug
        run: cmake --build . --target all --parallel 4

      - name: Run tests (Debug)
        working-directory: ./build/debug
        run: ctest --force-new-ctest-process --parallel 4

      - name: Configure project (Release)
        working-directory: ./build/release
        run: cmake ../.. -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release

      - name: Build project (Release)
        working-directory: ./build/release
        run: cmake --build . --target all --parallel 4

      - name: Install project
        working-directory: ./build/release
        run: sudo cmake --build . --target install

      - name: Package project
        working-directory: ./build/release
        run: sudo cpack --config ./CPackSourceConfig.cmake ../debug/CPackSourceConfig.cmake

      - name: Uninstall project
        working-directory: ./build/release
        run: sudo cmake --build . --target uninstall

  # macOS builds with Clang (latest)
  macos_build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: macOS-latest clang15
            os: macos-latest
            cc: clang
            cxx: clang++
            packages: ""

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    env:
      CC: ${{ matrix.config.cc }}
      CXX: ${{ matrix.config.cxx }}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install libusb cmake

      - name: Verify CMake version
        run: cmake --version

      - name: Prepare build directories
        run: mkdir -p ./build/{debug,release}

      - name: Configure project (Debug)
        working-directory: ./build/debug
        run: cmake ../.. -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Debug

      - name: Build project (Debug)
        working-directory: ./build/debug
        run: cmake --build . --target all --parallel 4

      - name: Run tests (Debug)
        working-directory: ./build/debug
        run: ctest --force-new-ctest-process --parallel 4

      - name: Configure project (Release)
        working-directory: ./build/release
        run: cmake ../.. -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release

      - name: Build project (Release)
        working-directory: ./build/release
        run: cmake --build . --target all --parallel 4

      - name: Install project
        working-directory: ./build/release
        run: sudo cmake --build . --target install

      - name: Package project
        working-directory: ./build/release
        run: sudo cpack --config ./CPackSourceConfig.cmake ../debug/CPackSourceConfig.cmake

      - name: Uninstall project
        working-directory: ./build/release
        run: sudo cmake --build . --target uninstall

  # Windows builds with MSVC
  # Visual Studio 2022 and vcpkg both ship on the windows-latest image, so
  # neither has to be installed. vcpkg reads the manifest in vcpkg.json.
  windows_msvc:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows_x64 msvc
            arch: x64
          - name: Windows_x86 msvc
            arch: Win32

    name: ${{ matrix.config.name }}
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify CMake version
        run: |
          cmake --version
          cmake --help | Select-String "Visual Studio"

      # No -G on purpose: cmake picks whichever Visual Studio the image has.
      # Pinning a generator by name goes stale, the runner image having moved
      # to Visual Studio 18 while every example still says 17 2022.
      - name: Configure project (Debug)
        run: >
          cmake -S . -B build/debug -A ${{ matrix.config.arch }}
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build project (Debug)
        run: cmake --build build/debug --config Debug --parallel 4

      - name: Run tests (Debug)
        working-directory: build/debug
        run: ctest --output-on-failure --build-config Debug --parallel 4

      - name: Configure project (Release)
        run: >
          cmake -S . -B build/release -A ${{ matrix.config.arch }}
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build project (Release)
        run: cmake --build build/release --config Release --parallel 4

      - name: Install project
        run: cmake --install build/release --config Release --prefix "${{ github.workspace }}/stage"

      # The install rules resolve runtime dependencies themselves, so list what
      # actually landed: a missing libusb-1.0.dll here is what makes an
      # installed st-info.exe fail to start on a machine without vcpkg.
      - name: Show installed tree
        run: Get-ChildItem -Recurse -File "${{ github.workspace }}/stage" | ForEach-Object { $_.FullName.Replace("${{ github.workspace }}\stage\", "") }

      - name: Package project
        run: cmake --build build/release --config Release --target package

      # Every path inside the zip, so that an absolute one, or a stray copy of
      # the builder's own directory layout, is visible here rather than in
      # somebody's download.
      - name: Show package contents
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          Get-ChildItem build/release/dist -Filter *.zip | ForEach-Object {
            Write-Output "=== $($_.Name) ($([math]::Round($_.Length / 1KB)) KB) ==="
            $zip = [IO.Compression.ZipFile]::OpenRead($_.FullName)
            $zip.Entries | ForEach-Object { Write-Output $_.FullName }
            $zip.Dispose()
          }

      - name: Uninstall project
        run: cmake --build build/release --config Release --target uninstall

  # Cross-compilation for MinGW (Windows)
  mingw_cross_compile:
    name: MinGW Cross-Compilation (Windows)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW toolchain and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64 cmake autotools-dev libtool libusb-1.0-0-dev

      - name: Cross-compile for Windows
        run: |
          sudo sh ./gen_binaries_win.sh

      - name: Show package contents
        run: |
          for z in build/Release/dist/*.zip; do
            echo "=== $(basename "$z") ($(du -h "$z" | cut -f1)) ==="
            unzip -l "$z"
          done

      # What an installed binary would need beside it. Nothing outside the
      # system set should appear here.
      - name: Show imported DLLs
        run: |
          mkdir -p /tmp/unpacked && cd /tmp/unpacked
          unzip -oq "${GITHUB_WORKSPACE}"/build/Release/dist/*x86_64*.zip || unzip -oq "${GITHUB_WORKSPACE}"/build/Release/dist/*.zip
          for exe in $(find . -name '*.exe'); do
            echo "=== $exe ==="
            x86_64-w64-mingw32-objdump -p "$exe" 2>/dev/null | grep -i "DLL Name" || true
          done
